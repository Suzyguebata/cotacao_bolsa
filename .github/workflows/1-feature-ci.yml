name: Feature CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  tests:
    name: Spark and API checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(github.head_ref, 'feature/')

    # O contexto `secrets` não é permitido em `if:` de steps; expõe via env.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Spark image
        run: docker compose build spark-bronze

      # O compose monta ./app em /app, então os XMLs de cobertura já ficam em app/ no runner.
      - name: Run Spark transformation tests with coverage
        run: docker compose run --rm --no-deps --user root spark-bronze /usr/bin/python3 -m pytest /app/tests/testes_logica_spark.py --cov=/app --cov-report=xml:/app/coverage-spark.xml

      - name: Build API image
        run: docker compose build api

      - name: Run API validation tests with coverage
        run: docker compose run --rm --no-deps api python -m pytest /app/tests/testes_validacao_api.py /app/tests/testes_agendador.py --cov=/app --cov-report=xml:/app/coverage-api.xml

      - name: Check API and agendador syntax
        run: docker compose run --rm --no-deps api python -m py_compile /app/api/api_ingestao.py /app/agendador.py

      - name: Sonar scan on runner (if SONAR_TOKEN set)
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          # Os relatórios apontam para /app (caminho no container); o scanner monta o repo em /usr/src.
          sed -i 's#<source>/app</source>#<source>/usr/src/app</source>#' coverage-*.xml
          docker run --rm -e SONAR_TOKEN -v "$GITHUB_WORKSPACE:/usr/src" sonarsource/sonar-scanner-cli

      - name: Clean Docker Compose resources
        if: always()
        run: docker compose down -v --remove-orphans
