name: Feature CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  tests:
    name: Spark and API checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(github.head_ref, 'feature/')

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Spark image
        run: docker compose build spark-bronze

      - name: Run Spark transformation tests
        run: docker compose run --rm --no-deps --user root spark-bronze /usr/bin/python3 -m pytest /app/tests/test_spark_logic.py

      - name: Build API image
        run: docker compose build api

      - name: Check API and scheduler syntax
        run: docker compose run --rm --no-deps api python -m py_compile /app/api/lambda_api.py /app/scheduler.py

      - name: Clean Docker Compose resources
        if: always()
        run: docker compose down -v --remove-orphans
