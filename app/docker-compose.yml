services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_started
    command: >
      bash -c "
      cub kafka-ready -b kafka:29092 1 60 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ${KAFKA_TOPIC:-cotacoes} --partitions 1 --replication-factor 1
      "

  minio:
    image: minio/minio:RELEASE.2024-01-11T07-46-16Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  spark-master:
    image: apache/spark:3.5.0-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080

  spark-worker:
    image: apache/spark:3.5.0-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=5
      - SPARK_WORKER_MEMORY=6G

  trino:
    image: trinodb/trino:435
    ports:
      - "8082:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/metastore:/etc/trino/metastore
    depends_on:
      minio:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -m uvicorn api.lambda_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-cotacoes}
      - BRAPI_TOKEN=${BRAPI_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: python -u scheduler.py
    environment:
      - MARKET_DATA_API_URL=http://api:8000/coletar/{}
      - MARKET_DATA_POLL_INTERVAL_MINUTES=${MARKET_DATA_POLL_INTERVAL_MINUTES:-5}
      - MARKET_DATA_TICKERS=${MARKET_DATA_TICKERS:-PETR4,VALE3,ITUB4,BBAS3,MGLU3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy

  spark-bronze:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: /opt/spark/bin/spark-submit --master spark://spark-master:7077 --driver-memory 1G --executor-memory 1G --total-executor-cores 1 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,io.delta:delta-spark_2.12:3.0.0,org.apache.hadoop:hadoop-aws:3.3.4 consumer/spark_consumer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-cotacoes}
      - MINIO_ENDPOINT_URL=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin123}
      - DATA_LAKE_BUCKET=${DATA_LAKE_BUCKET:-datalake}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

  spark-silver:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: /opt/spark/bin/spark-submit --master spark://spark-master:7077 --driver-memory 1G --executor-memory 1G --total-executor-cores 1 --packages io.delta:delta-spark_2.12:3.0.0,org.apache.hadoop:hadoop-aws:3.3.4 consumer/spark_silver.py
    environment:
      - MINIO_ENDPOINT_URL=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin123}
      - DATA_LAKE_BUCKET=${DATA_LAKE_BUCKET:-datalake}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      minio:
        condition: service_started
      spark-bronze:
        condition: service_started

  spark-quarantine:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: /opt/spark/bin/spark-submit --master spark://spark-master:7077 --driver-memory 1G --executor-memory 1G --total-executor-cores 1 --packages io.delta:delta-spark_2.12:3.0.0,org.apache.hadoop:hadoop-aws:3.3.4 consumer/spark_quarantena.py
    environment:
      - MINIO_ENDPOINT_URL=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin123}
      - DATA_LAKE_BUCKET=${DATA_LAKE_BUCKET:-datalake}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      minio:
        condition: service_started
      spark-bronze:
        condition: service_started

  spark-gold-operational:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: /opt/spark/bin/spark-submit --master spark://spark-master:7077 --driver-memory 1G --executor-memory 1G --total-executor-cores 1 --packages io.delta:delta-spark_2.12:3.0.0,org.apache.hadoop:hadoop-aws:3.3.4 consumer/spark_gold.py
    environment:
      - MINIO_ENDPOINT_URL=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin123}
      - DATA_LAKE_BUCKET=${DATA_LAKE_BUCKET:-datalake}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      minio:
        condition: service_started
      spark-silver:
        condition: service_started

  spark-gold-financial:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: /opt/spark/bin/spark-submit --master spark://spark-master:7077 --driver-memory 1G --executor-memory 1G --total-executor-cores 1 --packages io.delta:delta-spark_2.12:3.0.0,org.apache.hadoop:hadoop-aws:3.3.4 consumer/spark_gold_financeiro.py
    environment:
      - MINIO_ENDPOINT_URL=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-admin123}
      - DATA_LAKE_BUCKET=${DATA_LAKE_BUCKET:-datalake}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      minio:
        condition: service_started
      spark-silver:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=trino-datasource
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=trino-datasource
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
      - grafana_plugins:/var/lib/grafana/plugins
    depends_on:
      - prometheus
      - trino

volumes:
  minio_data:
  grafana_data:
  grafana_plugins:
