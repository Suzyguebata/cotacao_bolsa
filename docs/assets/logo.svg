<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo Circular Suave -->
  <circle cx="100" cy="100" r="90" fill="#F3EFFF" />
  
  <!-- Candlesticks (Representando Bolsa de Valores) -->
  <rect x="60" y="80" width="8" height="40" rx="2" fill="#9D81BA" />
  <line x1="64" y1="70" x2="64" y2="130" stroke="#9D81BA" stroke-width="2" />
  
  <rect x="96" y="60" width="8" height="60" rx="2" fill="#B6A2D1" />
  <line x1="100" y1="50" x2="100" y2="150" stroke="#B6A2D1" stroke-width="2" />
  
  <rect x="132" y="90" width="8" height="30" rx="2" fill="#9D81BA" />
  <line x1="136" y1="80" x2="136" y2="140" stroke="#9D81BA" stroke-width="2" />
  
  <!-- Nós de Dados (Representando Pipeline) -->
  <circle cx="100" cy="50" r="6" fill="#495057" />
  <circle cx="64" y="130" r="6" fill="#495057" />
  <circle cx="136" y="140" r="6" fill="#495057" />
  
  <!-- Conexões -->
  <path d="M100 56 L64 124" stroke="#495057" stroke-width="1.5" stroke-dasharray="4 2" />
  <path d="M100 56 L136 134" stroke="#495057" stroke-width="1.5" stroke-dasharray="4 2" />
</svg>
