# sonar-project.properties para SonarCloud / SonarQube (preenchido pelo assistente)
# Valores fornecidos pelo usuário
sonar.projectKey=xyb2026
sonar.projectName=ingestao_bolsa_de_valores
sonar.projectVersion=1.0

# Fonte do projeto (ajuste se necessário)
sonar.sources=app
sonar.sourceEncoding=UTF-8

# Host Sonar (SonarCloud)
sonar.host.url=https://sonarcloud.io
# Organização no SonarCloud (extraído da URL fornecida)
sonar.organization=suzyguebata

# Token de autenticação (usar segredo SONAR_TOKEN nas Actions)
# Não comite tokens no repositório — defina SONAR_TOKEN em Settings -> Secrets
sonar.login=${SONAR_TOKEN}

# Relatórios de cobertura esperados (os workflows copiam coverage-*.xml para GITHUB_WORKSPACE)
sonar.python.coverage.reportPaths=coverage-api.xml,coverage-spark.xml

# Ignore testes e arquivos gerados
sonar.exclusions=**/tests/**,**/__pycache__/**
