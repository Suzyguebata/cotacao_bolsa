# sonar-project.properties para SonarCloud / SonarQube (preenchido pelo assistente)
# Valores fornecidos pelo usuário
sonar.projectKey=xyb2026
sonar.projectName=ingestao_bolsa_de_valores
sonar.projectVersion=1.0

# Fonte do projeto (ajuste se necessário)
sonar.sources=app
sonar.sourceEncoding=UTF-8

# Host Sonar (SonarCloud)
sonar.host.url=https://sonarcloud.io
# Organização no SonarCloud (extraído da URL fornecida)
sonar.organization=suzyguebata

# Token de autenticação: o scanner lê a variável de ambiente SONAR_TOKEN
# (secret em Settings -> Secrets). Não comite tokens no repositório.

# Relatórios de cobertura gerados pelos workflows dentro de app/ (volume do compose)
sonar.python.coverage.reportPaths=app/coverage-api.xml,app/coverage-spark.xml

# Testes declarados separadamente das fontes
sonar.tests=app/tests
sonar.exclusions=**/tests/**,**/__pycache__/**
